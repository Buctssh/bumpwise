[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "billing-calc"
version = "0.9.1"
description = "Invoice arithmetic for a small shop"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=1.10,<2",
]

[tool.setuptools]
packages = ["billing_calc"]
