[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-feed"
version = "1.2.0"
description = "Parse a weather station feed and summarize the latest readings"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools]
packages = ["weather_feed"]
