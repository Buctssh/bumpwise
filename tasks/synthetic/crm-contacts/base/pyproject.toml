[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-contacts"
version = "3.1.0"
description = "Read CRM contacts and convert web leads"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=1.10,<2",
]

[tool.setuptools]
packages = ["crm_contacts"]
