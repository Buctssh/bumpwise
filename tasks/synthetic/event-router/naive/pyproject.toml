[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "event-router"
version = "0.4.2"
description = "Route monitoring events to notification channels"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools]
packages = ["event_router"]
